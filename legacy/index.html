<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spark · 星火</title>
<style>
  /* ---------- 设计令牌：米白渐变底 / 大圆角 / 藏青主色 ---------- */
  :root {
    --color-surface: #FFFFFF;
    --color-ink: #17252F;          /* 主文字与主按钮：深藏青 */
    --color-ink-soft: #4A5A66;     /* 次级文字 */
    --color-ink-mute: #8A97A3;     /* 辅助信息 */
    --color-navy: #17252F;
    --color-navy-hover: #0D1922;
    --color-accent: #4E86D8;       /* 图标与聚焦态的点缀蓝 */
    --color-accent-soft: rgba(78, 134, 216, .16);
    --color-line: #E9E6E4;
    --color-field-line: #DCD8D5;
    --color-warn-bg: #FFF6DF;
    --color-warn-text: #6B4E08;
    --radius-xl: 28px;
    --radius-lg: 20px;
    --radius-md: 14px;
    --radius-sm: 12px;
    --radius-pill: 999px;
    --shadow-card: 0 18px 40px rgba(23, 37, 47, .08), 0 2px 6px rgba(23, 37, 47, .04);
    --shadow-soft: 0 8px 22px rgba(23, 37, 47, .06);
    --font-sans: "Segoe UI", "Segoe UI Web (West European)", -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
    --space-page: 24px;
    --content-width: 720px;
  }

  /* ---------- 基础重置 ---------- */
  * { box-sizing: border-box; }

  /* 仅屏幕阅读器可见 */
  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }

  /* 头像图片加载失败时的占位渐变 */
  .avatar-option,
  .feed-avatar {
    background: linear-gradient(135deg, #DCE8F7 0%, #F3DDE1 100%);
  }

  .avatar-option img.is-broken { visibility: hidden; }

  body {
    margin: 0;
    min-height: 100vh;
    padding: 72px 0 88px;
    /* 米白 → 淡蓝粉的多层渐变底 */
    background:
      radial-gradient(1100px 640px at 6% 96%, rgba(244, 199, 205, .55), transparent 62%),
      radial-gradient(940px 560px at 98% 92%, rgba(150, 194, 245, .5), transparent 60%),
      radial-gradient(720px 420px at 90% 2%, rgba(226, 234, 246, .85), transparent 64%),
      linear-gradient(180deg, #FDF9F7 0%, #F8F6F7 46%, #F1F6FC 100%);
    background-attachment: fixed;
    color: var(--color-ink);
    font-family: var(--font-sans);
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* 柔和流体光斑：纯 CSS 渐变 + 模糊，无图片 */
  .bg-glow {
    position: fixed;
    z-index: 0;
    border-radius: 50%;
    filter: blur(64px);
    opacity: .55;
    pointer-events: none;
  }

  .bg-glow-1 {
    left: -150px;
    bottom: -170px;
    width: 420px;
    height: 420px;
    background: radial-gradient(circle at 45% 45%, #F3C3CB, rgba(243, 195, 203, 0));
  }

  .bg-glow-2 {
    right: -170px;
    bottom: -190px;
    width: 500px;
    height: 500px;
    background: radial-gradient(circle at 50% 50%, #8FC0F5, rgba(143, 192, 245, 0));
  }

  .bg-glow-3 {
    right: -120px;
    top: -140px;
    width: 400px;
    height: 400px;
    background: radial-gradient(circle at 50% 50%, #DDE9F8, rgba(221, 233, 248, 0));
  }

  /* 单栏内容列 */
  .layout {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: var(--content-width);
    margin: 0 auto;
    padding: 0 var(--space-page);
  }

  /* ---------- 居中 Hero ---------- */
  .page-header {
    max-width: 620px;
    margin: 0 auto 36px;
    text-align: center;
  }

  /* 手绘感 sparkle 图标，带柔光 */
  .brand-icon {
    display: inline-block;
    width: 62px;
    height: 62px;
    margin-bottom: 16px;
    filter: drop-shadow(0 10px 22px rgba(78, 134, 216, .3));
  }

  .brand-icon svg {
    display: block;
    width: 100%;
    height: 100%;
  }

  .page-title {
    margin: 0;
    font-size: 56px;
    font-weight: 600;
    letter-spacing: -1.8px;
    line-height: 1.05;
    color: var(--color-ink);
  }

  /* 中文副名：拉开字距的小字 */
  .page-name-cn {
    margin: 12px 0 0;
    font-size: 13px;
    letter-spacing: .46em;
    text-indent: .46em;
    color: var(--color-ink-mute);
  }

  .page-subtitle {
    margin: 14px 0 0;
    font-size: 16px;
    font-weight: 400;
    line-height: 1.7;
    color: var(--color-ink-soft);
  }

  /* ---------- 发布区：浮起的白色胶囊卡片 ---------- */
  .composer {
    background: var(--color-surface);
    border-radius: var(--radius-xl);
    box-shadow: var(--shadow-card);
    padding: 20px 22px 18px;
    margin-bottom: 22px;
  }

  .composer-input {
    display: block;
    width: 100%;
    min-height: 92px;
    max-height: 260px;
    padding: 14px 16px;
    border: 1px solid var(--color-field-line);
    border-radius: var(--radius-md);
    outline: 0;
    resize: vertical;
    background: #FFFFFF;
    color: var(--color-ink);
    font-family: inherit;
    font-size: 16px;
    line-height: 1.6;
    transition: border-color .15s ease, box-shadow .15s ease;
  }

  /* 聚焦：浅蓝描边 + 柔和光环 */
  .composer-input:focus {
    border-color: var(--color-accent);
    box-shadow: 0 0 0 3px var(--color-accent-soft);
  }

  .composer-input::placeholder { color: var(--color-ink-mute); }

  /* 昵称输入 */
  .composer-fields {
    display: block;
    margin-bottom: 12px;
  }

  .composer-name {
    flex: 1 1 auto;
    min-width: 0;
    height: 44px;
    padding: 0 14px;
    border: 1px solid var(--color-field-line);
    border-radius: var(--radius-sm);
    outline: 0;
    background: #FFFFFF;
    color: var(--color-ink);
    font-family: inherit;
    font-size: 15px;
    transition: border-color .15s ease, box-shadow .15s ease;
  }

  .composer-name:focus {
    border-color: var(--color-accent);
    box-shadow: 0 0 0 3px var(--color-accent-soft);
  }

  .composer-name::placeholder { color: var(--color-ink-mute); }

  /* 头像选择器：10 个圆角缩略图排成一字，选中态由 CSS 兄弟选择器控制 */
  .avatar-field {
    display: grid;
    grid-template-columns: repeat(10, 34px);
    justify-content: start;
    gap: 10px;
    margin: 0 0 12px;
    padding: 0;
    border: 0;
  }

  .avatar-radio {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }

  .avatar-option {
    position: relative;
    display: block;
    width: 34px;
    height: 34px;
    overflow: hidden;
    border: 2px solid transparent;
    border-radius: 10px;
    cursor: pointer;
    transition: border-color .15s ease, transform .15s ease;
  }

  /* 统一覆盖一层柔和的高光，让彩色插画与页面的淡雅色调贴合 */
  .avatar-option::after,
  .feed-avatar::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: linear-gradient(155deg, rgba(255, 255, 255, .42) 0%, rgba(255, 255, 255, .12) 52%, rgba(78, 134, 216, .14) 100%);
  }

  .avatar-option img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 8px;
    /* 统一压一档饱和与对比，让插画头像与页面的柔和色调一致 */
    filter: saturate(.82) contrast(.94) brightness(1.03);
  }

  .avatar-option:hover { border-color: #C9D5E0; }

  /* 选中：藏青描边 */
  .avatar-radio:checked + .avatar-option { border-color: var(--color-navy); }

  .avatar-radio:focus-visible + .avatar-option {
    outline: 2px solid var(--color-navy);
    outline-offset: 2px;
  }

  .composer-actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-top: 14px;
  }

  .hint-text {
    font-size: 12px;
    color: var(--color-ink-mute);
  }

  .hint-text[data-state="warn"] { color: #A4262C; }

  /* 主按钮：藏青实心胶囊 */
  .btn-submit {
    flex: none;
    min-height: 44px;
    padding: 0 28px;
    border: 0;
    border-radius: var(--radius-pill);
    background: var(--color-navy);
    color: #FFFFFF;
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background-color .18s ease, transform .18s ease, box-shadow .18s ease;
    box-shadow: 0 10px 22px rgba(23, 37, 47, .18);
  }

  .btn-submit:hover {
    background: var(--color-navy-hover);
    transform: translateY(-1px);
    box-shadow: 0 14px 26px rgba(23, 37, 47, .22);
  }

  .btn-submit:active { transform: translateY(0); }

  .btn-submit:focus-visible {
    outline: 2px solid var(--color-navy);
    outline-offset: 3px;
  }

  /* ---------- 存储不可用提示条：圆角信息条 ---------- */
  .notice {
    display: none;
    margin-bottom: 16px;
    padding: 12px 18px;
    border-radius: var(--radius-md);
    background: var(--color-warn-bg);
    color: var(--color-warn-text);
    font-size: 14px;
    line-height: 1.5;
  }

  .notice.is-visible { display: block; }

  /* ---------- 信息流：独立白色圆角卡片 ---------- */
  .feed {
    display: flex;
    flex-direction: column;
    gap: 12px;
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .feed-item {
    display: flex;
    gap: 14px;
    align-items: flex-start;
    padding: 18px 20px;
    background: var(--color-surface);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-soft);
    transition: transform .18s ease, box-shadow .18s ease;
    animation: rise .22s ease both;
  }

  /* 轻微上浮 + 阴影加深 */
  .feed-item:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-card);
  }

  .feed-avatar {
    position: relative;
    flex: none;
    display: block;
    width: 44px;
    height: 44px;
    overflow: hidden;
    border-radius: 12px;
  }

  .feed-avatar img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: saturate(.82) contrast(.94) brightness(1.03);
  }

  /* min-width:0 防止长文本撑破布局 */
  .feed-main {
    flex: 1 1 auto;
    min-width: 0;
  }

  /* 元信息行：昵称 · 时间 · 地点 */
  .feed-meta {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 6px;
    margin: 0 0 6px;
    font-size: 13px;
    color: var(--color-ink-mute);
  }

  .feed-author {
    font-size: 15px;
    font-weight: 600;
    color: var(--color-ink);
  }

  .feed-time {
    margin: 0;
    font-size: 13px;
    color: var(--color-ink-mute);
    font-variant-numeric: tabular-nums;
  }

  .feed-content {
    margin: 0;
    font-size: 15.5px;
    line-height: 1.65;
    color: #2A3A45;
    white-space: pre-wrap;
    overflow-wrap: break-word;
    word-break: break-word;
  }

  /* ---------- 空状态：圆角白卡 ---------- */
  .empty {
    margin: 0;
    padding: 44px 20px;
    background: var(--color-surface);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-soft);
    color: var(--color-ink-mute);
    font-size: 14px;
    text-align: center;
  }

  .empty[hidden] { display: none; }

  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ---------- 响应式：窄屏 ---------- */
  @media (max-width: 640px) {
    :root { --space-page: 18px; }
    body { padding-top: 40px; padding-bottom: 52px; font-size: 15px; }
    .page-header { margin-bottom: 26px; }
    .brand-icon { width: 52px; height: 52px; margin-bottom: 12px; }
    .page-title { font-size: 40px; letter-spacing: -1px; }
    .page-subtitle { font-size: 15px; }
    .composer { padding: 16px; border-radius: 22px; margin-bottom: 18px; }
    /* 窄屏：10 个头像仍排成一字，按列宽等比缩小 */
    .avatar-field { grid-template-columns: repeat(10, 1fr); gap: 6px; }
    .avatar-option { width: auto; height: auto; aspect-ratio: 1; border-radius: 8px; }
    .avatar-option img { border-radius: 6px; }
    .feed-item { padding: 16px; gap: 12px; border-radius: 18px; }
    .feed-avatar { width: 38px; height: 38px; border-radius: 10px; }
    .feed-author { font-size: 14px; }
    .feed-content { font-size: 15px; }
  }

  /* 尊重系统减少动效偏好 */
  @media (prefers-reduced-motion: reduce) {
    * {
      animation-duration: .001ms !important;
      transition-duration: .001ms !important;
    }
  }
</style>
</head>
<body>
<!-- 背景光斑：纯 CSS 渐变，仅装饰 -->
<div class="bg-glow bg-glow-1" aria-hidden="true"></div>
<div class="bg-glow bg-glow-2" aria-hidden="true"></div>
<div class="bg-glow bg-glow-3" aria-hidden="true"></div>

<div class="layout">
  <header class="page-header">
    <!-- 手绘感 sparkle 图标：纯内联 SVG + 渐变，无外部资源 -->
    <span class="brand-icon" aria-hidden="true">
      <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="sparkGrad" x1="8" y1="4" x2="56" y2="56" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#8FBEF0"></stop>
            <stop offset=".55" stop-color="#4E86D8"></stop>
            <stop offset="1" stop-color="#E3A9C2"></stop>
          </linearGradient>
        </defs>
        <path d="M30 6c2.2 15.6 7.4 20.8 23 23-15.6 2.2-20.8 7.4-23 23-2.2-15.6-7.4-20.8-23-23 15.6-2.2 20.8-7.4 23-23z" fill="url(#sparkGrad)"></path>
        <path d="M53 6c1 6.4 3.6 9 10 10-6.4 1-9 3.6-10 10-1-6.4-3.6-9-10-10 6.4-1 9-3.6 10-10z" fill="#A9CBF3"></path>
      </svg>
    </span>
    <h1 class="page-title">Spark</h1>
    <p class="page-name-cn">星火</p>
    <p class="page-subtitle">把此刻的想法留在这里，内容仅保存在本机浏览器</p>
  </header>

  <!-- 存储不可用时的降级提示 -->
  <p class="notice" id="notice" role="status">
    当前浏览器无法保存数据，内容仅在本次会话有效。
  </p>

  <!-- 发布区 -->
  <form class="composer" id="composer" autocomplete="off">
    <label class="page-subtitle" for="postInput" hidden>发布新动态</label>

    <!-- 昵称 -->
    <div class="composer-fields">
      <input
        class="composer-name"
        id="postAuthor"
        type="text"
        maxlength="20"
        placeholder="昵称（可选，默认匿名用户）"
        aria-label="昵称">
    </div>

    <!-- 头像选择：原生 radio，纯 CSS 控制选中态 -->
    <fieldset class="avatar-field">
      <legend class="visually-hidden">选择头像</legend>
      <input class="avatar-radio" type="radio" name="avatar" id="av0" value="0" checked>
      <label class="avatar-option" for="av0" title="头像 1"><img src="../public/avatars/avatar-01.jpg" alt="" width="64" height="64" loading="lazy" decoding="async" onerror="this.classList.add('is-broken')"></label>
      <input class="avatar-radio" type="radio" name="avatar" id="av1" value="1">
      <label class="avatar-option" for="av1" title="头像 2"><img src="../public/avatars/avatar-02.jpg" alt="" width="64" height="64" loading="lazy" decoding="async" onerror="this.classList.add('is-broken')"></label>
      <input class="avatar-radio" type="radio" name="avatar" id="av2" value="2">
      <label class="avatar-option" for="av2" title="头像 3"><img src="../public/avatars/avatar-03.jpg" alt="" width="64" height="64" loading="lazy" decoding="async" onerror="this.classList.add('is-broken')"></label>
      <input class="avatar-radio" type="radio" name="avatar" id="av3" value="3">
      <label class="avatar-option" for="av3" title="头像 4"><img src="../public/avatars/avatar-04.jpg" alt="" width="64" height="64" loading="lazy" decoding="async" onerror="this.classList.add('is-broken')"></label>
      <input class="avatar-radio" type="radio" name="avatar" id="av4" value="4">
      <label class="avatar-option" for="av4" title="头像 5"><img src="../public/avatars/avatar-05.jpg" alt="" width="64" height="64" loading="lazy" decoding="async" onerror="this.classList.add('is-broken')"></label>
      <input class="avatar-radio" type="radio" name="avatar" id="av5" value="5">
      <label class="avatar-option" for="av5" title="头像 6"><img src="../public/avatars/avatar-06.jpg" alt="" width="64" height="64" loading="lazy" decoding="async" onerror="this.classList.add('is-broken')"></label>
      <input class="avatar-radio" type="radio" name="avatar" id="av6" value="6">
      <label class="avatar-option" for="av6" title="头像 7"><img src="../public/avatars/avatar-07.jpg" alt="" width="64" height="64" loading="lazy" decoding="async" onerror="this.classList.add('is-broken')"></label>
      <input class="avatar-radio" type="radio" name="avatar" id="av7" value="7">
      <label class="avatar-option" for="av7" title="头像 8"><img src="../public/avatars/avatar-08.jpg" alt="" width="64" height="64" loading="lazy" decoding="async" onerror="this.classList.add('is-broken')"></label>
      <input class="avatar-radio" type="radio" name="avatar" id="av8" value="8">
      <label class="avatar-option" for="av8" title="头像 9"><img src="../public/avatars/avatar-09.jpg" alt="" width="64" height="64" loading="lazy" decoding="async" onerror="this.classList.add('is-broken')"></label>
      <input class="avatar-radio" type="radio" name="avatar" id="av9" value="9">
      <label class="avatar-option" for="av9" title="头像 10"><img src="../public/avatars/avatar-10.jpg" alt="" width="64" height="64" loading="lazy" decoding="async" onerror="this.classList.add('is-broken')"></label>
    </fieldset>

    <textarea
      class="composer-input"
      id="postInput"
      maxlength="500"
      placeholder="写点什么…"
      rows="3"></textarea>
    <div class="composer-actions">
      <span class="hint-text" id="hintText">最多 500 字</span>
      <button class="btn-submit" type="submit">发布</button>
    </div>
  </form>

  <!-- 信息流列表 -->
  <main>
    <ul class="feed" id="feed"></ul>
    <p class="empty" id="emptyState">还没有内容，试着发布第一条吧</p>
  </main>
</div>

<script>
(function () {
  'use strict';

  /* ========== 数据层 ========== */

  // 存储键名，带版本号便于日后结构演进
  var STORAGE_KEY = 'feed_posts_v1';

  // 单条动态结构：{ id, content, createdAt, author, avatar, location }
  // createdAt 为毫秒时间戳，既用于排序也用于展示；location 允许为 null（未获取到就不显示）
  var posts = [];

  var DEFAULT_AUTHOR = '匿名用户';
  var AVATAR_COUNT = 10;         // 与 avatars/ 目录中的图片数量一致

  // 昵称归一化：去首尾空白、截断 20 字，空值回落到默认昵称
  function normalizeAuthor(value) {
    if (typeof value !== 'string') return DEFAULT_AUTHOR;
    var text = value.trim().slice(0, 20);
    return text || DEFAULT_AUTHOR;
  }

  // 头像索引归一化：非法值退回 0
  function normalizeAvatar(value) {
    var n = typeof value === 'number' ? value : parseInt(value, 10);
    if (!isFinite(n) || n < 0 || n >= AVATAR_COUNT) return 0;
    return Math.floor(n);
  }

  // 地点归一化：空串与非法值统一为 null，渲染时即不显示
  function normalizeLocation(value) {
    if (typeof value !== 'string') return null;
    var text = value.trim();
    return text ? text.slice(0, 20) : null;
  }

  /**
   * 从 LocalStorage 读取动态列表。
   * 任何异常（存储被禁用、JSON 损坏、配额异常）都降级为空数组，不向外抛出。
   * @returns {{ list: Array, ok: boolean }} ok 表示存储是否可用
   */
  function loadPosts() {
    try {
      var raw = window.localStorage.getItem(STORAGE_KEY);
      if (!raw) return { list: [], ok: true };

      var parsed = JSON.parse(raw);
      if (!Array.isArray(parsed)) return { list: [], ok: true };

      // 过滤脏数据，避免历史损坏内容影响渲染
      var clean = [];
      for (var i = 0; i < parsed.length; i++) {
        var item = parsed[i];
        if (!item || typeof item !== 'object') continue;
        if (typeof item.content !== 'string' || item.content.trim() === '') continue;
        if (typeof item.createdAt !== 'number' || !isFinite(item.createdAt)) continue;
        clean.push({
          id: String(item.id || item.createdAt + '_' + i),
          content: item.content,
          createdAt: item.createdAt,
          // 旧数据没有以下字段，这里统一补默认值，实现向后兼容
          author: normalizeAuthor(item.author),
          avatar: normalizeAvatar(item.avatar),
          location: normalizeLocation(item.location)
        });
      }
      return { list: clean, ok: true };
    } catch (err) {
      // 读取失败（如隐私模式禁用存储）时以空列表继续
      return { list: [], ok: false };
    }
  }

  /**
   * 写入动态列表到 LocalStorage。
   * @returns {boolean} 是否写入成功
   */
  function savePosts(list) {
    try {
      window.localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
      return true;
    } catch (err) {
      // 写入失败（配额超限 / 存储被禁用）时返回 false，由调用方给出提示
      return false;
    }
  }

  /* ========== 定位层：内置城市坐标表（离线匹配，不调用任何外部接口） ========== */

  // [城市名, 纬度, 经度]，用于把定位得到的经纬度就近匹配成可读地名
  var CITY_TABLE = [
    ['北京', 39.90, 116.41], ['上海', 31.23, 121.47], ['广州', 23.13, 113.26],
    ['深圳', 22.54, 114.06], ['天津', 39.08, 117.20], ['重庆', 29.56, 106.55],
    ['成都', 30.57, 104.07], ['杭州', 30.27, 120.16], ['南京', 32.06, 118.80],
    ['武汉', 30.59, 114.31], ['西安', 34.34, 108.94], ['苏州', 31.30, 120.58],
    ['郑州', 34.75, 113.63], ['长沙', 28.23, 112.94], ['青岛', 36.07, 120.38],
    ['沈阳', 41.81, 123.43], ['大连', 38.91, 121.61], ['厦门', 24.48, 118.09],
    ['福州', 26.07, 119.30], ['济南', 36.65, 117.12], ['合肥', 31.82, 117.23],
    ['昆明', 25.04, 102.71], ['南昌', 28.68, 115.86], ['贵阳', 26.65, 106.63],
    ['南宁', 22.82, 108.37], ['太原', 37.87, 112.55], ['石家庄', 38.04, 114.51],
    ['哈尔滨', 45.80, 126.53], ['长春', 43.82, 125.32], ['兰州', 36.06, 103.83],
    ['乌鲁木齐', 43.83, 87.62], ['呼和浩特', 40.84, 111.75], ['银川', 38.49, 106.23],
    ['西宁', 36.62, 101.78], ['拉萨', 29.65, 91.14], ['海口', 20.04, 110.20],
    ['香港', 22.32, 114.17], ['台北', 25.03, 121.57], ['澳门', 22.20, 113.54]
  ];

  var CITY_RADIUS_KM = 200;   // 命中阈值：超出则视为不在已知城市附近
  var currentLocation = null; // 当前会话的位置，发布时写入动态

  function toRad(value) { return value * Math.PI / 180; }

  // Haversine 球面距离（公里）
  function distanceKm(lat1, lng1, lat2, lng2) {
    var R = 6371;
    var dLat = toRad(lat2 - lat1);
    var dLng = toRad(lng2 - lng1);
    var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
      Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
    return 2 * R * Math.asin(Math.sqrt(a));
  }

  // 在坐标表里找最近城市，超出阈值返回 null
  function matchCity(lat, lng) {
    var bestName = null;
    var bestKm = Infinity;
    for (var i = 0; i < CITY_TABLE.length; i++) {
      var d = distanceKm(lat, lng, CITY_TABLE[i][1], CITY_TABLE[i][2]);
      if (d < bestKm) {
        bestKm = d;
        bestName = CITY_TABLE[i][0];
      }
    }
    return bestKm <= CITY_RADIUS_KM ? bestName : null;
  }

  // 更新发布区右侧的定位状态文案
  function setLocStatus(text, isWarn) {
    var el = document.getElementById('locStatus');
    if (!el) return;
    el.textContent = text;
    el.setAttribute('data-state', isWarn ? 'warn' : 'normal');
  }

  /**
   * 请求定位并匹配城市。任何失败（无 API、拒绝授权、超时）都只降级为「位置不可用」，
   * 不抛错、不影响发布与浏览。
   */
  function initLocation() {
    if (!navigator.geolocation) {
      setLocStatus('位置不可用', true);
      return;
    }
    try {
      navigator.geolocation.getCurrentPosition(
        function (position) {
          try {
            currentLocation = matchCity(position.coords.latitude, position.coords.longitude);
          } catch (err) {
            currentLocation = null;
          }
          if (currentLocation) {
            setLocStatus('已定位：' + currentLocation, false);
          } else {
            setLocStatus('位置不可用', true);
          }
        },
        function () {
          currentLocation = null;
          setLocStatus('位置不可用', true);
        },
        { enableHighAccuracy: false, timeout: 8000, maximumAge: 600000 }
      );
    } catch (err) {
      currentLocation = null;
      setLocStatus('位置不可用', true);
    }
  }

  /* ========== 渲染层 ========== */

  /**
   * 时间戳格式化为 YYYY-MM-DD HH:mm（手动补零，不依赖第三方库）
   */
  function formatTime(ts) {
    var d = new Date(ts);
    if (isNaN(d.getTime())) return '';
    var pad = function (n) { return n < 10 ? '0' + n : String(n); };
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) +
      ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  // 头像图片路径：索引越界时回落到第 1 张，路径只在这里拼接
  function avatarSrc(index) {
    var i = normalizeAvatar(index) + 1;
    return 'avatars/avatar-' + (i < 10 ? '0' + i : String(i)) + '.jpg';
  }

  /**
   * 创建头像图片节点。
   * 尺寸写在属性里避免加载过程中布局抖动；加载失败只隐藏图片，由容器渐变兜底。
   */
  function createAvatarImg(index, className) {
    var img = document.createElement('img');
    img.className = className || '';
    img.src = avatarSrc(index);
    img.alt = '';
    img.width = 44;
    img.height = 44;
    img.decoding = 'async';
    img.onerror = function () {
      img.style.visibility = 'hidden';
    };
    return img;
  }

  // 元信息之间的分隔符「·」
  function createSep() {
    var sep = document.createElement('span');
    sep.className = 'feed-sep';
    sep.textContent = '·';
    return sep;
  }

  /**
   * 创建单条动态的 DOM 节点：左侧头像 + 右侧（昵称 · 时间 · 地点 + 正文）。
   * 所有用户文本均用 textContent 写入，天然避免 HTML 注入。
   */
  function createPostNode(post) {
    var li = document.createElement('li');
    li.className = 'feed-item';

    var avatar = document.createElement('span');
    avatar.className = 'feed-avatar';
    avatar.appendChild(createAvatarImg(post.avatar, 'feed-avatar-img'));

    var main = document.createElement('div');
    main.className = 'feed-main';

    var meta = document.createElement('p');
    meta.className = 'feed-meta';

    var author = document.createElement('span');
    author.className = 'feed-author';
    author.textContent = post.author;

    var time = document.createElement('span');
    time.className = 'feed-time';
    time.textContent = formatTime(post.createdAt);

    meta.appendChild(author);
    meta.appendChild(createSep());
    meta.appendChild(time);

    // 没有地点时不渲染该节点
    if (post.location) {
      var loc = document.createElement('span');
      loc.className = 'feed-loc';
      loc.textContent = post.location;
      meta.appendChild(createSep());
      meta.appendChild(loc);
    }

    var body = document.createElement('p');
    body.className = 'feed-content';
    body.textContent = post.content;

    main.appendChild(meta);
    main.appendChild(body);
    li.appendChild(avatar);
    li.appendChild(main);
    return li;
  }

  /**
   * 全量重绘信息流：按发布时间倒序，使用 DocumentFragment 批量插入。
   */
  function renderPosts() {
    var feedEl = document.getElementById('feed');
    var emptyEl = document.getElementById('emptyState');
    if (!feedEl || !emptyEl) return;

    // 倒序：最新的在最前
    var sorted = posts.slice().sort(function (a, b) {
      return b.createdAt - a.createdAt;
    });

    var fragment = document.createDocumentFragment();
    for (var i = 0; i < sorted.length; i++) {
      fragment.appendChild(createPostNode(sorted[i]));
    }

    feedEl.textContent = '';
    feedEl.appendChild(fragment);

    emptyEl.hidden = sorted.length > 0;
  }

  /* ========== 交互层 ========== */

  var hintEl = document.getElementById('hintText');
  var hintTimer = null;
  var DEFAULT_HINT = '最多 500 字';

  /**
   * 输入区下方的轻提示，2 秒后恢复默认文案。
   */
  function showHint(text, isWarn) {
    if (!hintEl) return;
    hintEl.textContent = text;
    hintEl.setAttribute('data-state', isWarn ? 'warn' : 'normal');
    if (hintTimer) window.clearTimeout(hintTimer);
    hintTimer = window.setTimeout(function () {
      hintEl.textContent = DEFAULT_HINT;
      hintEl.setAttribute('data-state', 'normal');
    }, 2000);
  }

  /**
   * 发布一条动态：校验 → 构造对象（含昵称/头像/地点）→ 持久化 → 重绘
   */
  function addPost(content, author, avatarIndex) {
    var text = content.trim();
    if (!text) {
      showHint('内容不能为空', true);
      return;
    }

    var post = {
      id: Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8),
      content: text,
      createdAt: Date.now(),
      author: normalizeAuthor(author),
      avatar: normalizeAvatar(avatarIndex),
      location: currentLocation
    };

    posts.push(post);

    // 写入失败时保留内存态，用户本次会话内仍可正常查看
    var saved = savePosts(posts);
    if (!saved) {
      var noticeEl = document.getElementById('notice');
      if (noticeEl) noticeEl.classList.add('is-visible');
    }

    renderPosts();
  }

  /* ========== 初始化 ========== */

  document.addEventListener('DOMContentLoaded', function () {
    var form = document.getElementById('composer');
    var input = document.getElementById('postInput');
    var authorInput = document.getElementById('postAuthor');
    var noticeEl = document.getElementById('notice');

    var loaded = loadPosts();
    posts = loaded.list;
    if (!loaded.ok && noticeEl) noticeEl.classList.add('is-visible');

    renderPosts();
    initLocation();   // 定位异步进行，不阻塞首屏

    if (!form || !input) return;

    form.addEventListener('submit', function (event) {
      event.preventDefault();

      // 读取当前选中的头像索引
      var checked = form.querySelector('input[name="avatar"]:checked');
      var avatarIndex = checked ? parseInt(checked.value, 10) : 0;

      addPost(input.value, authorInput ? authorInput.value : '', avatarIndex);

      // 只清空正文，昵称与头像选择保留，便于连续发布
      input.value = '';
      input.style.height = '';
      input.focus();
    });
  });
})();
</script>
</body>
</html>
