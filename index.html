<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>信息流</title>
<style>
  /* ---------- 设计令牌：纯白底 / 全直角 / 单一主色蓝 ---------- */
  :root {
    --color-bg: #FFFFFF;
    --color-panel: #F2F2F2;
    --color-primary: #0067B8;
    --color-primary-dark: #005A9E;
    --color-primary-soft: #E5F1FB;
    --color-text: #000000;
    --color-text-sub: #505050;
    --color-text-hint: #767676;
    --color-divider: #E6E6E6;
    --color-border-strong: #8A8886;
    --color-warn-bg: #FFF4CE;
    --color-warn-text: #5C4708;
    --color-warn-bar: #F2B01E;
    --font-sans: "Segoe UI", "Segoe UI Web (West European)", -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
    --space-page: 40px;
    --content-width: 768px;
  }

  /* ---------- 基础重置 ---------- */
  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: var(--space-page) 0 64px;
    background: var(--color-bg);
    color: var(--color-text);
    font-family: var(--font-sans);
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  /* 单栏容器：官网式宽阔内容列 */
  .layout {
    width: 100%;
    max-width: var(--content-width);
    margin: 0 auto;
    padding: 0 var(--space-page);
  }

  /* ---------- 顶部标题 ---------- */
  .page-header { margin-bottom: 28px; }

  .page-title {
    margin: 0;
    font-size: 32px;
    font-weight: 600;
    letter-spacing: -.2px;
    line-height: 1.25;
  }

  .page-subtitle {
    margin: 8px 0 0;
    font-size: 14px;
    font-weight: 400;
    color: var(--color-text-sub);
  }

  /* ---------- 发布面板：直角浅灰区块 ---------- */
  .composer {
    background: var(--color-panel);
    border-radius: 0;
    padding: 16px;
    margin-bottom: 36px;
  }

  .composer-input {
    display: block;
    width: 100%;
    min-height: 96px;
    max-height: 260px;
    padding: 12px;
    border: 1px solid var(--color-border-strong);
    border-radius: 0;
    outline: 0;
    resize: vertical;
    background: #FFFFFF;
    color: var(--color-text);
    font-family: inherit;
    font-size: 16px;
    line-height: 1.5;
    transition: border-color .15s ease, box-shadow .15s ease;
  }

  /* 聚焦：官网式蓝色描边，不使用外发光 */
  .composer-input:focus {
    border-color: var(--color-primary);
    box-shadow: inset 0 0 0 1px var(--color-primary);
  }

  .composer-input::placeholder { color: var(--color-text-hint); }

  .composer-actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-top: 12px;
  }

  .hint-text {
    font-size: 12px;
    color: var(--color-text-sub);
  }

  .hint-text[data-state="warn"] { color: #A4262C; }

  .btn-submit {
    flex: none;
    min-height: 40px;
    padding: 0 24px;
    border: 0;
    border-radius: 0;
    background: var(--color-primary);
    color: #FFFFFF;
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background-color .15s ease;
  }

  .btn-submit:hover { background: var(--color-primary-dark); }

  /* 键盘聚焦：黑色方框，任意底色上都清晰 */
  .btn-submit:focus-visible {
    outline: 2px solid #000000;
    outline-offset: 2px;
  }

  /* ---------- 存储不可用提示条：直角信息条 ---------- */
  .notice {
    display: none;
    margin-bottom: 20px;
    padding: 12px 16px;
    border-left: 3px solid var(--color-warn-bar);
    background: var(--color-warn-bg);
    color: var(--color-warn-text);
    font-size: 14px;
    line-height: 1.5;
  }

  .notice.is-visible { display: block; }

  /* ---------- 资讯式列表：细分割线，无卡片无阴影 ---------- */
  .feed {
    list-style: none;
    margin: 0;
    padding: 0;
    border-bottom: 1px solid var(--color-divider);
  }

  .feed-item {
    padding: 20px 0;
    border-top: 1px solid var(--color-divider);
    transition: background-color .15s ease;
    animation: rise .18s ease both;
  }

  /* 整行悬停底色转灰，不位移不缩放 */
  .feed-item:hover { background: var(--color-panel); }

  .feed-time {
    margin: 0 0 6px;
    font-size: 13px;
    color: var(--color-text-hint);
    font-variant-numeric: tabular-nums;
  }

  .feed-item:hover .feed-time { color: var(--color-text-sub); }

  .feed-content {
    margin: 0;
    font-size: 16px;
    line-height: 1.5;
    color: var(--color-text);
    white-space: pre-wrap;
    overflow-wrap: break-word;
    word-break: break-word;
  }

  /* ---------- 空状态：直角浅灰块 ---------- */
  .empty {
    margin: 0;
    padding: 48px 20px;
    background: var(--color-panel);
    color: var(--color-text-sub);
    font-size: 14px;
    text-align: center;
  }

  .empty[hidden] { display: none; }

  @keyframes rise {
    from { opacity: 0; transform: translateY(2px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ---------- 响应式：窄屏 ---------- */
  @media (max-width: 640px) {
    :root { --space-page: 16px; }
    body { padding-top: 24px; padding-bottom: 40px; font-size: 15px; }
    .page-title { font-size: 26px; }
    .page-header { margin-bottom: 24px; }
    .composer { margin-bottom: 28px; }
    .feed-item { padding: 16px 0; }
    .feed-content { font-size: 15px; }
  }

  /* 尊重系统减少动效偏好 */
  @media (prefers-reduced-motion: reduce) {
    * {
      animation-duration: .001ms !important;
      transition-duration: .001ms !important;
    }
  }
</style>
</head>
<body>
<div class="layout">
  <header class="page-header">
    <h1 class="page-title">信息流</h1>
    <p class="page-subtitle">内容仅保存在本机浏览器</p>
  </header>

  <!-- 存储不可用时的降级提示 -->
  <p class="notice" id="notice" role="status">
    当前浏览器无法保存数据，内容仅在本次会话有效。
  </p>

  <!-- 发布区 -->
  <form class="composer" id="composer" autocomplete="off">
    <label class="page-subtitle" for="postInput" hidden>发布新动态</label>
    <textarea
      class="composer-input"
      id="postInput"
      maxlength="500"
      placeholder="写点什么…"
      rows="3"></textarea>
    <div class="composer-actions">
      <span class="hint-text" id="hintText">最多 500 字</span>
      <button class="btn-submit" type="submit">发布</button>
    </div>
  </form>

  <!-- 信息流列表 -->
  <main>
    <ul class="feed" id="feed"></ul>
    <p class="empty" id="emptyState">还没有内容，试着发布第一条吧</p>
  </main>
</div>

<script>
(function () {
  'use strict';

  /* ========== 数据层 ========== */

  // 存储键名，带版本号便于日后结构演进
  var STORAGE_KEY = 'feed_posts_v1';

  // 单条动态结构：{ id: string, content: string, createdAt: number }
  // createdAt 为毫秒时间戳，既用于排序也用于格式化展示
  var posts = [];

  /**
   * 从 LocalStorage 读取动态列表。
   * 任何异常（存储被禁用、JSON 损坏、配额异常）都降级为空数组，不向外抛出。
   * @returns {{ list: Array, ok: boolean }} ok 表示存储是否可用
   */
  function loadPosts() {
    try {
      var raw = window.localStorage.getItem(STORAGE_KEY);
      if (!raw) return { list: [], ok: true };

      var parsed = JSON.parse(raw);
      if (!Array.isArray(parsed)) return { list: [], ok: true };

      // 过滤脏数据，避免历史损坏内容影响渲染
      var clean = [];
      for (var i = 0; i < parsed.length; i++) {
        var item = parsed[i];
        if (!item || typeof item !== 'object') continue;
        if (typeof item.content !== 'string' || item.content.trim() === '') continue;
        if (typeof item.createdAt !== 'number' || !isFinite(item.createdAt)) continue;
        clean.push({
          id: String(item.id || item.createdAt + '_' + i),
          content: item.content,
          createdAt: item.createdAt
        });
      }
      return { list: clean, ok: true };
    } catch (err) {
      // 读取失败（如隐私模式禁用存储）时以空列表继续
      return { list: [], ok: false };
    }
  }

  /**
   * 写入动态列表到 LocalStorage。
   * @returns {boolean} 是否写入成功
   */
  function savePosts(list) {
    try {
      window.localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
      return true;
    } catch (err) {
      // 写入失败（配额超限 / 存储被禁用）时返回 false，由调用方给出提示
      return false;
    }
  }

  /* ========== 渲染层 ========== */

  /**
   * 时间戳格式化为 YYYY-MM-DD HH:mm（手动补零，不依赖第三方库）
   */
  function formatTime(ts) {
    var d = new Date(ts);
    if (isNaN(d.getTime())) return '';
    var pad = function (n) { return n < 10 ? '0' + n : String(n); };
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) +
      ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  /**
   * 创建单条动态的 DOM 节点。
   * 使用 textContent 写入用户文本，避免 HTML 注入。
   */
  function createPostNode(post) {
    var li = document.createElement('li');
    li.className = 'feed-item';

    var time = document.createElement('p');
    time.className = 'feed-time';
    time.textContent = formatTime(post.createdAt);

    var body = document.createElement('p');
    body.className = 'feed-content';
    body.textContent = post.content;

    li.appendChild(time);
    li.appendChild(body);
    return li;
  }

  /**
   * 全量重绘信息流：按发布时间倒序，使用 DocumentFragment 批量插入。
   */
  function renderPosts() {
    var feedEl = document.getElementById('feed');
    var emptyEl = document.getElementById('emptyState');
    if (!feedEl || !emptyEl) return;

    // 倒序：最新的在最前
    var sorted = posts.slice().sort(function (a, b) {
      return b.createdAt - a.createdAt;
    });

    var fragment = document.createDocumentFragment();
    for (var i = 0; i < sorted.length; i++) {
      fragment.appendChild(createPostNode(sorted[i]));
    }

    feedEl.textContent = '';
    feedEl.appendChild(fragment);

    emptyEl.hidden = sorted.length > 0;
  }

  /* ========== 交互层 ========== */

  var hintEl = document.getElementById('hintText');
  var hintTimer = null;
  var DEFAULT_HINT = '最多 500 字';

  /**
   * 输入区下方的轻提示，2 秒后恢复默认文案。
   */
  function showHint(text, isWarn) {
    if (!hintEl) return;
    hintEl.textContent = text;
    hintEl.setAttribute('data-state', isWarn ? 'warn' : 'normal');
    if (hintTimer) window.clearTimeout(hintTimer);
    hintTimer = window.setTimeout(function () {
      hintEl.textContent = DEFAULT_HINT;
      hintEl.setAttribute('data-state', 'normal');
    }, 2000);
  }

  /**
   * 发布一条动态：校验 → 构造对象 → 持久化 → 重绘 → 清空输入框
   */
  function addPost(content) {
    var text = content.trim();
    if (!text) {
      showHint('内容不能为空', true);
      return;
    }

    var post = {
      id: Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8),
      content: text,
      createdAt: Date.now()
    };

    posts.push(post);

    // 写入失败时保留内存态，用户本次会话内仍可正常查看
    var saved = savePosts(posts);
    if (!saved) {
      var noticeEl = document.getElementById('notice');
      if (noticeEl) noticeEl.classList.add('is-visible');
    }

    renderPosts();
  }

  /* ========== 初始化 ========== */

  document.addEventListener('DOMContentLoaded', function () {
    var form = document.getElementById('composer');
    var input = document.getElementById('postInput');
    var noticeEl = document.getElementById('notice');

    var loaded = loadPosts();
    posts = loaded.list;
    if (!loaded.ok && noticeEl) noticeEl.classList.add('is-visible');

    renderPosts();

    if (!form || !input) return;

    form.addEventListener('submit', function (event) {
      event.preventDefault();
      addPost(input.value);
      input.value = '';
      input.style.height = '';
      input.focus();
    });
  });
})();
</script>
</body>
</html>
